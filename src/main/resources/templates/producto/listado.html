<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragmentos :: head}"></th:block>
    <title>Listado de Productos</title>
</head>
<body>

    <div th:replace="~{layout/fragmentos :: navbar}"></div>

    <main class="container mt-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Listado de Productos</h2>
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/producto/nuevo}"
               class="btn btn-primary">Nuevo producto</a>
        </div>

        <div th:if="${productos != null and !productos.empty}" class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Existencias</th>
                        <th>Activo</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.idProducto}"></td>
                        <td th:text="${producto.descripcion}"></td>
                        <td th:text="${producto.categoria != null ? producto.categoria.descripcion : 'Sin categoría'}"></td>
                        <td th:text="${producto.precio}"></td>
                        <td th:text="${producto.existencias}"></td>
                        <td th:text="${producto.activo ? 'Sí' : 'No'}"></td>
                        <td class="text-center">
                            <a sec:authorize="hasAnyRole('ADMIN','VENDEDOR')"
                               th:href="@{/producto/modificar(idProducto=${producto.idProducto})}"
                               class="btn btn-warning btn-sm me-1">Modificar</a>

                            <a sec:authorize="hasRole('ADMIN')"
                               th:href="@{/producto/eliminar(idProducto=${producto.idProducto})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar este producto?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${productos == null or productos.empty}" class="alert alert-info">
            No hay productos registrados.
        </div>

    </main>

    <div th:replace="~{layout/fragmentos :: footer}"></div>
    <div th:replace="~{layout/fragmentos :: scripts}"></div>

</body>
</html>
