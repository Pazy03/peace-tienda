<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{layout/fragmentos :: head}"></th:block>
    <title>Gestión de Categoría</title>
</head>
<body>

    <div th:replace="~{layout/fragmentos :: navbar}"></div>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="mb-4">Gestión de Categoría</h2>

                        <form th:action="@{/categoria/guardar}" th:object="${categoria}" method="post">

                            <input type="hidden" th:field="*{idCategoria}" />

                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{descripcion}"
                                       sec:authorize="hasAnyRole('ADMIN','VENDEDOR')"
                                       required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Ruta de imagen</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{rutaImagen}"
                                       sec:authorize="hasAnyRole('ADMIN','VENDEDOR')" />
                            </div>

                            <div class="form-check mb-3">
                                <input type="checkbox"
                                       class="form-check-input"
                                       th:field="*{activo}"
                                       sec:authorize="hasAnyRole('ADMIN','VENDEDOR')" />
                                <label class="form-check-label">Activo</label>
                            </div>

                            <div class="d-flex gap-2">

                                <!-- SOLO ADMIN puede guardar -->
                                <button type="submit"
                                        class="btn btn-success"
                                        sec:authorize="hasRole('ADMIN')">
                                    Guardar
                                </button>

                                <a th:href="@{/categoria/listado}"
                                   class="btn btn-secondary">
                                   Volver
                                </a>

                            </div>

                        </form>

                        <!-- Mensaje para VENDEDOR -->
                        <div sec:authorize="hasRole('VENDEDOR')"
                             class="alert alert-warning mt-3">
                            Solo el administrador puede guardar cambios.
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <div th:replace="~{layout/fragmentos :: footer}"></div>
    <div th:replace="~{layout/fragmentos :: scripts}"></div>

</body>
</html>
