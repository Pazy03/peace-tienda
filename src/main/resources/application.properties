spring.application.name=tienda
# -----------------------------
# CONEXIÓN A MYSQL
# -----------------------------

spring.datasource.url=jdbc:mysql://localhost:3306/tienda?useTimezone=true&serverTimezone=UTC
spring.datasource.username=usuario_tienda
spring.datasource.password=1234

# -----------------------------
# JPA / HIBERNATE
# -----------------------------

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# -----------------------------
# LOGS 
# -----------------------------

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE
